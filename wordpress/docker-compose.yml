services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: avicinna_root_password
      MYSQL_DATABASE: avicinna_wp
      MYSQL_USER: avicinna_user
      MYSQL_PASSWORD: avicinna_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.4-fpm-alpine
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: avicinna_wp
      WORDPRESS_DB_USER: avicinna_user
      WORDPRESS_DB_PASSWORD: avicinna_password
    volumes:
      - wp_data:/var/www/html
      - ./plugins/avicinna-headless:/var/www/html/wp-content/plugins/avicinna-headless

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data:
  wp_data:
